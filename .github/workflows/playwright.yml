name: Playwright Tests
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: playwright-reports
    cancel-in-progress: false

jobs:
    lint:
        name: Lint and Format Checks
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set Up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*

            - name: Install dependencies - clean install
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

    test:
        name: Run E2E Tests
        needs: lint
        timeout-minutes: 30
        runs-on: ubuntu-latest
        outputs:
            report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set Up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*

            - name: Install dependencies - clean install
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run Playwright tests
              env:
                  STANDARD_USER: ${{ secrets.STANDARD_USER }}
                  STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
                  LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
                  LOCKED_OUT_PASSWORD: ${{ secrets.LOCKED_OUT_PASSWORD }}
              run: npx playwright test tests/

            - name: Save Playwright report to artifacts
              id: upload-report
              uses: actions/upload-artifact@v6
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
                  if-no-files-found: error
    test-report:
        name: Deploy Playwright Report
        needs: test

        if: >-
            ${{
                !cancelled() && needs.test.outputs.report-artifact-id != '' &&
                (
                    github.event_name == 'push' ||
                    (
                        github.event_name == 'pull_request' &&
                        github.event.pull_request.head.repo.full_name == github.repository
                    )
                )
            }}

        runs-on: ubuntu-latest

        permissions:
            contents: write

        environment:
            name: playwright-reports
            url: ${{ steps.report.outputs.url }}

        steps:
            - name: Generate report URL
              id: report
              env:
                  OWNER: ${{ github.repository_owner }}
                  REPO: ${{ github.event.repository.name }}
                  SHA: ${{ github.sha }}
              run: |
                  DATE=$(date -u +'%Y-%m-%d')
                  OWNER="${OWNER,,}"

                  REPORT_PATH="reports/${DATE}/${SHA}"
                  REPORT_URL="https://${OWNER}.github.io/${REPO}/${REPORT_PATH}/"

                  echo "path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"
                  echo "url=${REPORT_URL}" >> "$GITHUB_OUTPUT"

            - name: Download Playwright Report
              uses: actions/download-artifact@v8
              with:
                  name: playwright-report
                  path: playwright-report/

            - name: Publish Playwright Report
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./playwright-report
                  publish_branch: gh-pages
                  destination_dir: ${{ steps.report.outputs.path }}
                  keep_files: true

            - name: Generate latest report metadata
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  SHA: ${{ github.sha }}
                  REPORT_URL: ${{ steps.report.outputs.url }}
              run: |
                  mkdir -p latest-metadata

                  jq -n \
                  --arg sha "$SHA" \
                  --arg url "$REPORT_URL" \
                  --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                  '{
                      sha: $sha,
                      reportUrl: $url,
                      publishedAt: $publishedAt
                  }' > latest-metadata/latest.json

            - name: Publish latest report metadata
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./latest-metadata
                  publish_branch: gh-pages
                  destination_dir: reports
                  keep_files: true
